<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Delivery Boy — LPG Dealer Accounts</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topbar">
  <div>
    <h1>SR Bharat Gas, Kammapuram</h1>
    <div class="sub">Delivery Boy — Trip Sheet</div>
  </div>
  <div class="who">
    <span id="whoName"></span>
    <button class="btn ghost" id="signOutBtn">Sign Out</button>
  </div>
</header>

<main>
  <div id="msg" class="msg hidden"></div>

  <div class="card" id="tripCard">
    <h2>Trip Details</h2>
    <form id="tripForm">
      <div class="grid">
        <div>
          <label>Date</label>
          <input type="date" id="tripDate" required />
        </div>
        <div>
          <label>Vehicle Number</label>
          <input type="text" id="tripVehicle" required placeholder="TN-91-R-3889" />
        </div>
        <div>
          <label>Line</label>
          <input type="text" id="tripLine" placeholder="Local / Mainroad" />
        </div>
        <div>
          <label>Starting KMS</label>
          <input type="number" id="tripStartKms" step="1" />
        </div>
        <div>
          <label>Ending KMS</label>
          <input type="number" id="tripEndKms" step="1" />
        </div>
      </div>
      <div class="row-actions">
        <button type="submit" class="btn" id="tripSaveBtn">Save Trip Details</button>
      </div>
    </form>
  </div>

  <div class="card" id="entriesCard" style="display:none;">
    <h2>Add Consumer Delivery</h2>
    <form id="entryForm">
      <div class="grid">
        <div>
          <label>Consumer No.</label>
          <input type="text" id="eConsumerNo" required />
        </div>
        <div>
          <label>Consumer Name</label>
          <input type="text" id="eConsumerName" required />
        </div>
        <div>
          <label>Phone No.</label>
          <input type="tel" id="ePhone" />
        </div>
        <div>
          <label>Bio Metric</label>
          <select id="eBio"><option value="">-</option><option value="OK">OK</option><option value="Fail">Fail</option></select>
        </div>
        <div>
          <label>Safety Check</label>
          <select id="eSafety"><option value="">-</option><option value="OK">OK</option><option value="Fail">Fail</option></select>
        </div>
        <div>
          <label>OTP</label>
          <input type="text" id="eOtp" />
        </div>
        <div>
          <label>Amount (₹)</label>
          <input type="number" id="eAmount" step="0.01" value="0" />
        </div>
      </div>
      <div class="row-actions">
        <button type="submit" class="btn" id="entryAddBtn">Add Entry</button>
      </div>
    </form>
  </div>

  <div class="card" id="listCard" style="display:none;">
    <h2>Today's Deliveries</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>S.No</th><th>Consumer No.</th><th>Consumer Name</th><th>Phone</th>
            <th>Bio</th><th>Safety</th><th>OTP</th><th>Amount</th><th></th>
          </tr>
        </thead>
        <tbody id="entriesBody"></tbody>
      </table>
    </div>
    <div class="totals" style="margin-top:12px;">
      <div class="tile credit">
        <div class="label">Total Deliveries</div>
        <div class="value" id="totalCount">0</div>
      </div>
      <div class="tile credit">
        <div class="label">Total Amount Collected</div>
        <div class="value" id="totalAmount">₹0</div>
      </div>
    </div>
  </div>
</main>

<footer class="note">Internal use only — SR Bharat Gas, Kammapuram</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/cloud.js"></script>
<script src="js/delivery.js"></script>
</body>
</html>
